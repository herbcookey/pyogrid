<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>"*" width</title>
<link rel="stylesheet" href="/dist/pyogrid.css">
</head>
<body>
<!-- layout.spec.js: 컨테이너 너비가 바뀌면 "*" 컬럼이 다시 계산된다 -->
<div id="g" style="width:600px;height:200px"></div>
<script src="/dist/pyogrid.js"></script>
<script>
  window.grid = new PyoGrid(document.getElementById("g"), { columns: [{ key: "a", width: 100 }, { key: "b", width: "*" }] });
  grid.setData([{ a: 1, b: 2 }]);
</script>
</body>
</html>
