<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>PyoGrid 셀 편집기</title>
  <link rel="stylesheet" href="../dist/pyogrid.css">
  <style>
    body { margin: 8px; font-family: sans-serif; font-size: 13px; }
    ul { margin: 4px 0 8px; padding-left: 18px; color: #475467; font-size: 12px; }
    #log { margin-top: 6px; height: 120px; overflow: auto; padding: 4px 8px; border: 1px solid #ddd; font: 12px/1.5 monospace; color: #344054; }
  </style>
</head>
<body>
<ul>
  <li>셀을 누르고 그냥 치면 편집이 시작됩니다 (한글도 첫 글자부터). F2·Enter·더블클릭은 지금 값으로 편집.</li>
  <li>Enter 저장 후 아래, Shift+Enter 위, Tab 오른쪽, Esc 취소, Delete 선택 범위 지우기, Backspace 지우고 입력.</li>
  <li>수량·금액은 숫자만, 일자는 숫자만 쳐도 yyyy-MM-dd (달력도 열림), 구분은 목록에서 고르거나 글자로 찾기, 사용은 클릭·Space.</li>
  <li>"잠김" 행의 비고는 편집할 수 없습니다 (editor.disabled).</li>
</ul>
<div id="grid" style="height:360px; width: 980px;"></div>
<div id="log"></div>
<script src="../dist/pyogrid.js"></script>
<script>
  var kinds = [{ CD: "A", NM: "가공" }, { CD: "B", NM: "부품" }, { CD: "C", NM: "조립" }, { CD: "D", NM: "도장" }, { CD: "E", NM: "검사" }];
  var rows = [];
  for (var i = 0; i < 200; i++) {
    rows.push({
      no: i + 1, name: "품목 " + (i + 1), qty: (i * 7) % 50, amt: ((i * 7919) % 90000) + 1000,
      dt: i % 3 ? "" : "2026-11-" + String(1 + (i % 28)).padStart(2, "0"),
      cd: kinds[i % kinds.length].CD, use: i % 4 ? "Y" : "N", memo: i % 5 === 0 ? "잠김" : "", locked: i % 5 === 0
    });
  }
  var grid = new PyoGrid(document.getElementById("grid"), {
    locale: "ko",
    lineNumber: true, rowSelector: true, frozenColumns: 2, sortable: true, headerAlign: "center",
    columns: [
      { key: "no", label: "번호", width: 60, align: "right" },
      { key: "name", label: "품명", width: 160, editor: { type: "text", attributes: { maxlength: 30 } } },
      { key: "qty", label: "수량", width: 80, align: "right", editor: { type: "number", config: { min: 0 } } },
      { key: "amt", label: "금액", width: 110, align: "right", formatter: "money", editor: { type: "money" } },
      { key: "dt", label: "일자", width: 110, align: "center", editor: { type: "date" } },
      { key: "cd", label: "구분", width: 90, align: "center",
        editor: { type: "select", config: { columnKeys: { optionValue: "CD", optionText: "NM" }, options: kinds } } },
      { key: "use", label: "사용", width: 60, align: "center", editor: { type: "checkbox", config: { trueValue: "Y", falseValue: "N" } } },
      { key: "memo", label: "비고", width: "*", editor: { type: "text", disabled: function (c) { return c.row.locked; } } }
    ]
  });
  grid.setData(rows);
  window.grid = grid;
  var log = document.getElementById("log");
  function write(s) { log.insertAdjacentText("afterbegin", s + "\n"); }
  grid.on("change", function (e) { if (!e.batch) write(e.rowIndex + "행 " + e.key + ": " + JSON.stringify(e.oldValue) + " → " + JSON.stringify(e.value)); });
  grid.on("batchchange", function (e) { write(e.source + " " + e.changes.length + "셀"); });
</script>
</body>
</html>
