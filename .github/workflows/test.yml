# push·pull request마다 타입 검사, 단위 테스트, 브라우저 테스트(Chrome·Firefox·WebKit)를 돈다.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치에 새로 push하면 앞의 실행은 끊는다
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/sync-version.mjs --check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  e2e:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # playwright.config.js의 project 이름. chrome은 Playwright가 Google Chrome을 설치한다
        browser: [chrome, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - name: Run browser tests
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Keep the failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
