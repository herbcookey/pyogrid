# push·pull request마다 lint, 타입 검사, 단위 테스트(커버리지), 브라우저 테스트(Chrome·Firefox·WebKit)를 돈다.
# release.yml이 배포 전에 이 워크플로를 그대로 부른다 (workflow_call).
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# 같은 브랜치에 새로 push하면 앞의 실행은 끊는다
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/sync-version.mjs --check
      - run: npm run lint
      - run: npm run docs:check
      - run: npm run typecheck
      # 단위 테스트를 커버리지와 함께 돌린다. vitest.config.js의 기준보다 낮으면 실패한다
      - run: npm run test:coverage
      - name: Report coverage
        if: always()
        run: node tools/coverage-summary.mjs
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
      - run: npm run build
      - run: npm run typecheck:types

  e2e:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # playwright.config.js의 project 이름. chrome은 Playwright가 Google Chrome을 설치한다
        browser: [chrome, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - name: Run browser tests
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Keep the failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  # 성능 회귀 확인: big.html(50,000행 × 30열)을 재서 tools/perf-baseline.json과 비교한다.
  # CI 기계는 편차가 커서 느려져도 경고(::warning::)와 작업 요약만 남기고 실패시키지 않는다.
  # 배포(release.yml이 부를 때, 태그)에서는 돌지 않는다.
  perf:
    name: Performance check (warning only)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chrome
      - run: npm run build
      - run: npm run perf
