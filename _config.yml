# GitHub Pages (Jekyll) 설정.
# 사이트 주소: https://herbcookey.github.io/pyogrid/
# README.md가 첫 화면(index), README.ko.md는 /README.ko.html, docs/design.md는 /docs/design.html이 된다.

title: pyogrid
description: A fast, dependency-free JavaScript data grid with virtual scrolling, spreadsheet-style editing, and IME-friendly input.
lang: en
theme: jekyll-theme-primer

# 사이트에 올리지 않을 파일. Jekyll은 문서(README, docs/)와 그림(docs/images/)만 만든다.
# demo/와 dist/는 Jekyll을 거치지 않고 .github/workflows/pages.yml이 빌드한 뒤 그대로 덧붙인다.
exclude:
  - src/
  - test/
  - tools/
  - demo/
  - node_modules/
  - dist/
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.types.json
  - vitest.config.js
  - playwright.config.js
